name: ci

on:
  push:
  pull_request:

env:
  # 锁文件漂移视为失败(等价于 uv sync --locked)
  UV_LOCKED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: lint
        run: make lint

      - name: test
        run: make test

      # contract-test 自阶段 1 起为真实门禁(uv run pytest packages/contracts)。
      - name: contract-test
        run: make contract-test
