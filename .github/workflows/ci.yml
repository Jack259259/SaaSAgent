name: ci

on:
  push:
  pull_request:

env:
  # 锁文件漂移视为失败(等价于 uv sync --locked)
  UV_LOCKED: "1"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: lint
        run: make lint

      - name: test
        run: make test

      # contract-test 自阶段 1 起为真实门禁(uv run pytest packages/contracts)。
      - name: contract-test
        run: make contract-test

      # 阶段 10:评估回归全集为必过门禁(阈值见 evals/README;e2e 剧本确定性=1.0)。
      - name: eval-nl2sql
        run: make eval E=nl2sql

      - name: eval-rag-qa
        run: make eval E=rag-qa

      - name: eval-code-qa
        run: make eval E=code-qa

      - name: eval-sop-replay
        run: make eval E=sop-replay

      - name: eval-e2e
        run: make eval E=e2e

      # 安全负例总套件(tests/security)为必过门禁;跨能力端到端见 tests/e2e(已随 make test 收口)。
      - name: security-negatives
        run: uv run pytest tests/security
