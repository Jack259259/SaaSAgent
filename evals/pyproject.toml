[project]
name = "evalkit"
version = "0.1.0"
description = "评估套件 runner + 5 金标集(方案 §10;CLAUDE.md §7/§10)"
requires-python = ">=3.12"
dependencies = [
    "code-svc",
    "contracts",
    "data-svc",
    "duckdb>=1.0",
    "llm",
    "orchestrator",
    "rag-svc",
    "sop-executor",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
code-svc = { workspace = true }
contracts = { workspace = true }
data-svc = { workspace = true }
llm = { workspace = true }
orchestrator = { workspace = true }
rag-svc = { workspace = true }
sop-executor = { workspace = true }
