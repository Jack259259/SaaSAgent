[project]
name = "contracts"
version = "0.1.0"
description = "框架无关的契约层:ToolSpec/Envelope/AgentState/Audit/SOP schema + pydantic 运行时模型 + 加载器 + 校验器(CLAUDE.md §5)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
