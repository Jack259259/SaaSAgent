<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资金计划助手</title>
  <meta name="description" content="资金计划 SaaS 智能助手 · 内嵌前端(原生 + Alpine,零构建,同源同部署)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230d9488'/%3E%3C/svg%3E">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('fp_theme');
        if (!t) { t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* file:// 等场景保留默认 light */ }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="vendor/highlight/github.min.css" id="hljs-theme">
  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/highlight/highlight.min.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
</head>
<body x-data="app" x-cloak>
  <!-- 共享文件选择(📎 触发) -->
  <input type="file" multiple class="file-input-hidden" x-ref="fileInput" @change="pickFiles($event)"
         accept=".docx,.odt,.rtf,.epub,.html,.htm,.md,.markdown,.txt,.xlsx,.csv,.json,.jpg,.jpeg,.png,.gif">

  <div class="app-shell" @dragover="onDragOver($event)" @dragleave="onDragLeave($event)" @drop="onDrop($event)">

    <!-- 整页拖拽遮罩 -->
    <div class="drag-overlay" x-show="dragover" x-transition.opacity>
      <div class="drag-card"><span class="i" x-html="icon('paperclip')"></span> 拖拽文件到此上传</div>
    </div>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" :class="{ open: sidebarOpen }" aria-label="会话与导航">
      <div class="sidebar-head">
        <button class="new-btn" type="button" @click="newConversation()"><span class="i" x-html="icon('plus')"></span>新建对话</button>
      </div>
      <nav class="conv-list" aria-label="历史会话">
        <template x-for="grp in [['today','今天'],['week','7天内'],['older','更早']]" :key="grp[0]">
          <div class="conv-group-wrap" x-show="convGroups()[grp[0]].length">
            <div class="conv-group" x-text="grp[1]"></div>
            <template x-for="c in convGroups()[grp[0]]" :key="c.id">
              <div class="conv-item" :class="{ 'is-active': c.id === activeConvId }">
                <button class="conv-open" type="button" @click="switchConversation(c.id)" x-text="c.title"></button>
                <span class="conv-ops">
                  <button class="conv-op" type="button" @click.stop="renameConversation(c.id)" title="重命名" aria-label="重命名" x-html="icon('pencil')"></button>
                  <button class="conv-op" type="button" @click.stop="deleteConversation(c.id)" title="删除" aria-label="删除" x-html="icon('trash')"></button>
                </span>
              </div>
            </template>
          </div>
        </template>
        <p class="conv-hint" x-show="!conversations.length">还没有历史会话(本机 localStorage)。</p>
      </nav>
      <div class="sidebar-foot">
        <button class="side-link" type="button" x-show="skillAdmin()" @click="openSkills()">Skill 管理</button>
        <button class="side-link" type="button" @click="clearHistory()">清除本地历史</button>
        <button class="side-link" type="button">用户 / 设置</button>
      </div>
    </aside>
    <div class="backdrop" x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity></div>

    <!-- ===== Main ===== -->
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn hamburger" type="button" @click="sidebarOpen = !sidebarOpen" aria-label="打开 / 关闭侧栏" x-html="icon('menu')"></button>
        <div class="topbar-title" x-text="conversationTitle"></div>
        <div class="topbar-actions">
          <button class="icon-btn" type="button" @click="toggleTheme()" :aria-label="theme === 'dark' ? '切换到亮色主题' : '切换到暗色主题'" :title="theme === 'dark' ? '切换到亮色' : '切换到暗色'" x-html="theme === 'dark' ? icon('sun') : icon('moon')"></button>
          <button class="icon-btn" type="button" aria-label="用户菜单" title="用户菜单(占位)" x-html="icon('user')"></button>
        </div>
      </header>

      <main class="chat" :class="{ 'is-empty': !hasMessages }">

        <!-- ===== 顶部任务进展区(W2,改动①) ===== -->
        <template x-if="currentRun && currentRun.plan">
          <section class="run-panel live" aria-label="任务进展">
            <div class="run-head">
              <button class="run-toggle" type="button" @click="toggleCollapse(currentRun)">
                <span class="chev" :class="{ open: !currentRun?.collapsed }">▸</span>
                <span x-show="currentRun?.collapsed" x-text="runSummary(currentRun)"></span>
                <span x-show="!currentRun?.collapsed">任务进展</span>
              </button>
              <div class="run-actions" x-show="!currentRun?.collapsed && currentRun?.toolTimeline?.length">
                <button class="link-btn" type="button" @click="expandAllTools(currentRun.toolTimeline, true)">展开全部</button>
                <button class="link-btn" type="button" @click="expandAllTools(currentRun.toolTimeline, false)">收起全部</button>
              </div>
            </div>
            <div class="run-body" x-show="!currentRun?.collapsed">
              <ol class="plan-steps">
                <template x-for="(s, si) in (currentRun?.plan?.steps || [])" :key="s.id || si">
                  <li class="plan-step" :class="'st-' + s.status">
                    <span class="step-dot"></span>
                    <span class="step-goal" x-text="s.goal"></span>
                    <span class="step-status" x-text="stepLabel(s.status)"></span>
                  </li>
                </template>
              </ol>
              <div class="run-focus" x-show="currentRun?.focus" x-text="'▸ ' + (currentRun?.focus || '')"></div>
              <ul class="tool-timeline" x-show="currentRun?.toolTimeline?.length">
                <template x-for="(t, ti) in (currentRun?.toolTimeline || [])" :key="t.id || ti">
                  <li class="tool-item" :class="'ts-' + t.status">
                    <div class="tool-row" :class="{ clickable: t.status !== 'running' && t.tier !== 'inline' }" @click="t.status !== 'running' && t.tier !== 'inline' && toggleTool(currentRun.toolTimeline, ti)">
                      <span class="tool-stat" :class="'ts-' + t.status" x-text="toolStatIcon(t.status)"></span>
                      <span class="tool-name" x-text="t.displayName"></span>
                      <span class="tool-ov" x-text="toolOverview(t)"></span>
                      <span class="tool-exp" x-show="t.status !== 'running' && t.tier !== 'inline'" x-text="t.expanded ? '收起' : '展开 ▸'"></span>
                    </div>
                    <div class="tool-result" x-show="t.status !== 'running' && (t.tier === 'inline' || t.expanded)">
                      <div class="tool-result-box" x-show="t.tier === 'structured'" @click="onBodyClick($event)" x-html="toolResultHtml(t)"></div>
                      <div class="tool-result-text" x-show="t.tier !== 'structured'" x-text="t.resultSummary"></div>
                    </div>
                  </li>
                </template>
              </ul>
            </div>
          </section>
        </template>

        <!-- ===== 空状态 ===== -->
        <section class="welcome" x-show="!hasMessages">
          <h1 class="welcome-title">资金计划助手</h1>
          <p class="welcome-sub">问我资金计划、取数、知识检索或页面操作。</p>
          <form class="composer" @submit.prevent="sendMessage()">
            <div class="attach-row" x-show="attachments.length">
              <template x-for="a in attachments" :key="a.localId">
                <div class="att-card" :class="'att-' + a.status">
                  <template x-if="a.thumbUrl"><img class="att-thumb" :src="a.thumbUrl" :alt="a.name"></template>
                  <span class="att-icon" x-show="!a.thumbUrl" x-html="icon('paperclip')"></span>
                  <div class="att-meta">
                    <div class="att-name" x-text="a.name"></div>
                    <div class="att-sub">
                      <span x-text="humanSize(a.size)"></span>
                      <span x-show="a.status === 'uploading'" x-text="' · ' + Math.round(a.progress) + '%'"></span>
                      <span class="att-warn" x-show="a.status === 'uploaded' && a.parse_supported === false"> · 已上传,解析待后端支持</span>
                      <span class="att-err" x-show="a.status === 'error'" x-text="' · ' + a.error"></span>
                    </div>
                    <div class="att-bar" x-show="a.status === 'uploading'"><div class="att-bar-fill" :style="'width:' + a.progress + '%'"></div></div>
                  </div>
                  <button class="att-retry" type="button" x-show="a.status === 'error'" @click="retryAttachment(a.localId)">重试</button>
                  <button class="att-x icon-btn" type="button" @click="removeAttachment(a.localId)" aria-label="移除" x-html="icon('x')"></button>
                </div>
              </template>
            </div>
            <div class="composer-row">
              <button class="icon-btn attach" type="button" @click="$refs.fileInput.click()" title="添加附件" aria-label="添加附件" x-html="icon('paperclip')"></button>
              <textarea class="composer-input" rows="1" x-model="draft" placeholder="给资金计划助手发消息…(Enter 发送,Shift+Enter 换行)" @keydown="onComposerKeydown($event)" @input="autogrow($event)" aria-label="消息输入"></textarea>
              <button class="send-btn" type="submit" :disabled="!canSend()" aria-label="发送" x-html="icon('arrow-up')"></button>
            </div>
          </form>
          <p class="welcome-hint">试试:复杂任务 / 并行 / replan / 错误 / 延迟(停止)/ 澄清 —— 触发不同 mock 场景</p>
        </section>

        <!-- ===== 会话区 ===== -->
        <div class="scroller" x-ref="scroller" @scroll="onScroll($event)" x-show="hasMessages">
          <div class="messages" aria-live="polite">
            <template x-for="m in messages" :key="m.id">
              <article class="msg" :class="'msg-' + m.role">
                <div class="msg-inner">

                  <!-- 用户:纯文本 + 附件卡片 -->
                  <div class="msg-body user-body" x-show="m.role === 'user'">
                    <div class="user-text" x-text="m.raw"></div>
                    <div class="user-atts" x-show="m.attachments && m.attachments.length">
                      <template x-for="(a, ai) in (m.attachments || [])" :key="ai">
                        <div class="att-chip" :class="{ warn: a.parse_supported === false }">
                          <template x-if="a.thumbUrl"><img class="att-chip-thumb" :src="a.thumbUrl" :alt="a.name"></template>
                          <span class="att-chip-icon" x-show="!a.thumbUrl" x-html="icon('paperclip')"></span>
                          <span class="att-chip-name" x-text="a.name"></span>
                          <span class="att-chip-sz" x-text="humanSize(a.size)"></span>
                          <span class="att-chip-warn" x-show="a.parse_supported === false" title="解析待后端支持">⚠</span>
                        </div>
                      </template>
                    </div>
                  </div>
                  <div class="msg-action-bar user-actions" x-show="m.role === 'user' && editingId !== m.id">
                    <button class="act-btn" type="button" title="复制" aria-label="复制提问" @click="copyMessage($event, m, 'text')"><span class="act-ico" x-html="icon('copy')"></span></button>
                    <button class="act-btn" type="button" title="编辑" aria-label="编辑提问" @click="editMessage(m)"><span class="act-ico" x-html="icon('pencil')"></span></button>
                    <button class="act-btn" type="button" title="重试" aria-label="重试该提问" @click="retryUserMessage(m)"><span class="act-ico" x-html="icon('refresh-cw')"></span></button>
                  </div>

                  <!-- 助手:blocks -->
                  <template x-if="m.role === 'assistant'">
                    <div class="asst">
                      <template x-for="(b, bi) in m.blocks" :key="bi">
                        <div class="block">
                          <template x-if="b.type === 'text'">
                            <div class="msg-body assistant-body" @click="onBodyClick($event)">
                              <span class="stream-text" x-show="b.open" x-text="b.raw"></span><span class="cursor" x-show="b.open && m.streaming" aria-hidden="true"></span>
                              <div class="md" x-show="!b.open" x-html="b.html"></div>
                            </div>
                          </template>
                          <template x-if="b.type === 'confirm'">
                            <div class="card confirm-card">
                              <div class="card-title">需要确认</div>
                              <div class="card-body" x-text="b.prompt"></div>
                              <div class="card-actions" x-show="!b.resolved">
                                <button class="btn primary" type="button" @click="confirmChoice(b, true)" x-text="(b.options && b.options[0]) || '确认'"></button>
                                <button class="btn" type="button" @click="confirmChoice(b, false)" x-text="(b.options && b.options[1]) || '取消'"></button>
                              </div>
                              <div class="card-done" x-show="b.resolved" x-text="b.confirmed ? '已确认' : '已取消'"></div>
                            </div>
                          </template>
                          <template x-if="b.type === 'ask'">
                            <div class="card ask-card">
                              <div class="card-title">需要澄清</div>
                              <template x-for="(q, qi) in b.questions" :key="qi">
                                <div class="ask-q">
                                  <div class="ask-question" x-text="q.question"></div>
                                  <div class="ask-options">
                                    <template x-for="(opt, oi) in (q.options || [])" :key="oi">
                                      <button class="chip" type="button" :class="{ sel: b.selected[qi] === opt }" :disabled="b.resolved" @click="askPick(b, qi, opt)" x-text="opt"></button>
                                    </template>
                                  </div>
                                </div>
                              </template>
                              <div class="card-actions" x-show="!b.resolved">
                                <button class="btn primary" type="button" :disabled="!askComplete(b)" @click="submitAsk(b)">提交</button>
                              </div>
                              <div class="card-done" x-show="b.resolved">已提交</div>
                            </div>
                          </template>
                          <template x-if="b.type === 'citation'">
                            <div class="card citation-card">
                              <div class="card-title">来源引用</div>
                              <ul class="cite-list">
                                <template x-for="(c, ci) in b.items" :key="ci">
                                  <li><a :href="c.ref || '#'" target="_blank" rel="noopener noreferrer" x-text="c.title"></a><span class="cite-src" x-show="c.source" x-text="' · ' + c.source"></span></li>
                                </template>
                              </ul>
                            </div>
                          </template>
                          <template x-if="b.type === 'error'">
                            <div class="card error-card">
                              <div class="card-title">出错了</div>
                              <div class="card-body" x-text="b.message"></div>
                              <div class="card-actions"><button class="btn" type="button" @click="retry()">重试</button></div>
                            </div>
                          </template>
                          <template x-if="b.type === 'note'">
                            <div class="msg-note" x-text="b.text"></div>
                          </template>
                          <template x-if="b.type === 'run'">
                            <section class="run-panel snapshot">
                              <div class="run-head">
                                <button class="run-toggle" type="button" @click="toggleCollapse(b)">
                                  <span class="chev" :class="{ open: !b.collapsed }">▸</span>
                                  <span x-show="b.collapsed" x-text="runSummary(b)"></span>
                                  <span x-show="!b.collapsed">任务进展(已完成)</span>
                                </button>
                                <div class="run-actions" x-show="!b.collapsed && b.toolTimeline.length">
                                  <button class="link-btn" type="button" @click="expandAllTools(b.toolTimeline, true)">展开全部</button>
                                  <button class="link-btn" type="button" @click="expandAllTools(b.toolTimeline, false)">收起全部</button>
                                </div>
                              </div>
                              <div class="run-body" x-show="!b.collapsed">
                                <ol class="plan-steps">
                                  <template x-for="(s, si) in b.plan.steps" :key="s.id || si">
                                    <li class="plan-step" :class="'st-' + s.status">
                                      <span class="step-dot"></span>
                                      <span class="step-goal" x-text="s.goal"></span>
                                      <span class="step-status" x-text="stepLabel(s.status)"></span>
                                    </li>
                                  </template>
                                </ol>
                                <ul class="tool-timeline" x-show="b.toolTimeline.length">
                                  <template x-for="(t, ti) in b.toolTimeline" :key="t.id || ti">
                                    <li class="tool-item" :class="'ts-' + t.status">
                                      <div class="tool-row" :class="{ clickable: t.tier !== 'inline' }" @click="t.tier !== 'inline' && toggleTool(b.toolTimeline, ti)">
                                        <span class="tool-stat" :class="'ts-' + t.status" x-text="toolStatIcon(t.status)"></span>
                                        <span class="tool-name" x-text="t.displayName"></span>
                                        <span class="tool-ov" x-text="toolOverview(t)"></span>
                                        <span class="tool-exp" x-show="t.tier !== 'inline'" x-text="t.expanded ? '收起' : '展开 ▸'"></span>
                                      </div>
                                      <div class="tool-result" x-show="t.tier === 'inline' || t.expanded">
                                        <div class="tool-result-box" x-show="t.tier === 'structured'" @click="onBodyClick($event)" x-html="toolResultHtml(t)"></div>
                                        <div class="tool-result-text" x-show="t.tier !== 'structured'" x-text="t.resultSummary"></div>
                                      </div>
                                    </li>
                                  </template>
                                </ul>
                              </div>
                            </section>
                          </template>
                        </div>
                      </template>
                      <!-- 模型回复操作栏:整条一栏,完成后显示(对齐 claude.ai)-->
                      <div class="msg-action-bar asst-actions" x-show="!m.streaming && hasTextBlock(m)">
                        <button class="act-btn" type="button" title="复制" aria-label="复制回答（纯文本）" @click="copyMessage($event, m, 'text')"><span class="act-ico" x-html="icon('copy')"></span></button>
                        <button class="act-btn" type="button" title="复制 Markdown 源" aria-label="复制回答（Markdown 源）" @click="copyMessage($event, m, 'md')"><span class="act-ico act-md">Md</span></button>
                        <button class="act-btn" type="button" title="赞" aria-label="点赞" :class="{ on: m.vote === 'up' }" :aria-pressed="m.vote === 'up'" @click="setVote(m, 'up')"><span class="act-ico" x-html="icon('thumbs-up')"></span></button>
                        <button class="act-btn" type="button" title="踩" aria-label="点踩" :class="{ on: m.vote === 'down' }" :aria-pressed="m.vote === 'down'" @click="setVote(m, 'down')"><span class="act-ico" x-html="icon('thumbs-down')"></span></button>
                        <button class="act-btn" type="button" title="重新生成" aria-label="重新生成回答" @click="retryAssistant(m)"><span class="act-ico" x-html="icon('refresh-cw')"></span></button>
                      </div>
                      <div class="feedback-box" x-show="m.showComment">
                        <textarea class="feedback-input" rows="2" maxlength="500" x-model="m.feedbackComment" placeholder="可选:这条回答哪里不好?(可跳过)" aria-label="反馈意见"></textarea>
                        <div class="feedback-actions">
                          <button class="btn sm" type="button" @click="submitFeedbackComment(m)">提交</button>
                          <button class="btn sm ghost" type="button" @click="cancelFeedbackComment(m)">跳过</button>
                        </div>
                      </div>
                    </div>
                  </template>

                </div>
              </article>
            </template>
          </div>
        </div>
      </main>

      <!-- 底部 Composer -->
      <div class="composer-bar" x-show="hasMessages">
        <form class="composer" @submit.prevent="sendMessage()">
          <div class="edit-hint" x-show="editingId">
            <span class="act-ico" x-html="icon('pencil')"></span>
            <span>编辑中,发送将覆盖此后内容</span>
            <button class="link-btn" type="button" @click="cancelMessageEdit()">取消</button>
          </div>
          <div class="attach-row" x-show="attachments.length">
            <template x-for="a in attachments" :key="a.localId">
              <div class="att-card" :class="'att-' + a.status">
                <template x-if="a.thumbUrl"><img class="att-thumb" :src="a.thumbUrl" :alt="a.name"></template>
                <span class="att-icon" x-show="!a.thumbUrl" x-html="icon('paperclip')"></span>
                <div class="att-meta">
                  <div class="att-name" x-text="a.name"></div>
                  <div class="att-sub">
                    <span x-text="humanSize(a.size)"></span>
                    <span x-show="a.status === 'uploading'" x-text="' · ' + Math.round(a.progress) + '%'"></span>
                    <span class="att-warn" x-show="a.status === 'uploaded' && a.parse_supported === false"> · 已上传,解析待后端支持</span>
                    <span class="att-err" x-show="a.status === 'error'" x-text="' · ' + a.error"></span>
                  </div>
                  <div class="att-bar" x-show="a.status === 'uploading'"><div class="att-bar-fill" :style="'width:' + a.progress + '%'"></div></div>
                </div>
                <button class="att-retry" type="button" x-show="a.status === 'error'" @click="retryAttachment(a.localId)">重试</button>
                <button class="att-x icon-btn" type="button" @click="removeAttachment(a.localId)" aria-label="移除" x-html="icon('x')"></button>
              </div>
            </template>
          </div>
          <div class="composer-row">
            <button class="icon-btn attach" type="button" @click="$refs.fileInput.click()" title="添加附件" aria-label="添加附件" x-html="icon('paperclip')"></button>
            <textarea class="composer-input" rows="1" x-model="draft" placeholder="给资金计划助手发消息…" @keydown="onComposerKeydown($event)" @input="autogrow($event)" aria-label="消息输入"></textarea>
            <button class="send-btn" type="button" @click="sendStatus === 'streaming' ? stopStream() : sendMessage()" :disabled="sendStatus !== 'streaming' && !canSend()" :class="{ 'is-stop': sendStatus === 'streaming' }" :aria-label="sendStatus === 'streaming' ? '停止' : '发送'">
              <span x-show="sendStatus !== 'streaming'" x-html="icon('arrow-up')"></span>
              <span x-show="sendStatus === 'streaming'" class="stop-sq" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <!-- ===== Skill 管理 overlay(W4)===== -->
  <div class="skills-overlay" x-show="skillsOpen" x-transition.opacity @keydown.escape.window="skillsOpen && closeSkills()">
    <div class="skills-panel">
      <div class="skills-header">
        <h2 class="skills-title">Skill 管理</h2>
        <div class="skills-header-actions">
          <button class="btn primary" type="button" @click="startNew()">新建 Skill</button>
          <button class="btn" type="button" @click="$refs.skillZip.click()">上传 Skill 包</button>
          <button class="icon-btn" type="button" @click="closeSkills()" aria-label="关闭" x-html="icon('x')"></button>
        </div>
      </div>
      <input type="file" accept=".zip" class="file-input-hidden" x-ref="skillZip" @change="pickSkillZip($event)">
      <div class="skills-body">

        <!-- 列表 -->
        <template x-if="skillView === 'list'">
          <div class="skills-list">
            <div class="skill-state" x-show="skillsLoading">加载中…</div>
            <div class="skill-state skills-err" x-show="skillsError" x-text="skillsError"></div>
            <div class="skill-state" x-show="!skillsLoading && !skillsError && !skillsList.length">暂无 Skill。点击「新建 Skill」或「上传 Skill 包」。</div>
            <div class="upload-results" x-show="skillUploadError || skillUploadResults">
              <div class="skills-err" x-show="skillUploadError" x-text="skillUploadError"></div>
              <template x-if="skillUploadResults">
                <div>
                  <div class="upload-results-title">上传结果(后端解压入库,逐条):</div>
                  <ul>
                    <template x-for="(r, ri) in skillUploadResults" :key="ri">
                      <li :class="r.ok ? 'ok' : 'bad'"><span x-text="r.ok ? '✓' : '✗'"></span> <span x-text="r.name"></span><span x-show="!r.ok" x-text="' — ' + (r.reason || '')"></span></li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>
            <template x-for="s in skillsList" :key="s.id">
              <div class="skill-card" @click="viewSkill(s.id)">
                <div class="skill-card-main">
                  <div class="skill-name" x-text="s.name"></div>
                  <div class="skill-desc" x-text="s.description"></div>
                </div>
                <span class="skill-status" :class="'ss-' + s.status" x-text="statusLabel(s.status)"></span>
                <span class="skill-updated" x-text="skillFmtTime(s.updated_at)"></span>
                <button class="conv-op skill-del" type="button" @click.stop="removeSkill(s.id)" title="删除" aria-label="删除" x-html="icon('trash')"></button>
              </div>
            </template>
          </div>
        </template>

        <!-- 详情 -->
        <template x-if="skillView === 'detail' && skillCurrent">
          <div class="skill-detail">
            <button class="link-btn" type="button" @click="skillView = 'list'">← 返回列表</button>
            <div class="skill-detail-head">
              <h3 x-text="skillCurrent.name"></h3>
              <span class="skill-status" :class="'ss-' + skillCurrent.status" x-text="statusLabel(skillCurrent.status)"></span>
            </div>
            <div class="skill-meta" x-text="skillCurrent.description"></div>
            <div class="skill-actions">
              <button class="btn" type="button" @click="startEdit()">编辑</button>
              <button class="btn primary" type="button" x-show="skillCurrent.status !== 'active'" @click="publishSkill()">发布生效</button>
              <button class="btn" type="button" @click="removeSkill(skillCurrent.id)">删除</button>
            </div>
            <div class="md skill-content" x-html="skillContentHtml()"></div>
          </div>
        </template>

        <!-- 新建 / 编辑 -->
        <template x-if="skillView === 'edit' || skillView === 'new'">
          <div class="skill-form">
            <button class="link-btn" type="button" @click="cancelEdit()">← 取消</button>
            <h3 x-text="skillView === 'new' ? '新建 Skill' : '编辑 Skill'"></h3>
            <label class="form-field">
              <span>名称</span>
              <input class="form-input" type="text" x-model="skillForm.name" @input="skillFormError = ''" placeholder="字母 / 数字 / _ / -,2–64 字符">
            </label>
            <div class="form-err" x-show="skillFormError" x-text="skillFormError"></div>
            <div class="skill-edit-grid">
              <label class="skill-edit-col">
                <span>SKILL.md</span>
                <textarea class="form-textarea" x-model="skillForm.content" spellcheck="false"></textarea>
              </label>
              <div class="skill-edit-col">
                <span class="preview-label">实时预览(已消毒)</span>
                <div class="md skill-preview" x-html="skillPreviewHtml()"></div>
              </div>
            </div>
            <div class="schema-errs" x-show="skillSchemaErrors.length">
              <div class="schema-errs-title">后端 schema 校验未过:</div>
              <ul><template x-for="(e, ei) in skillSchemaErrors" :key="ei"><li x-text="e"></li></template></ul>
            </div>
            <div class="skill-form-actions">
              <button class="btn primary" type="button" :disabled="skillSaving" @click="submitSkill()">提交</button>
              <span class="save-hint" x-show="skillSaveHint" x-text="skillSaveHint"></span>
            </div>
          </div>
        </template>

      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script defer src="vendor/alpine/alpine.min.js"></script>
</body>
</html>
