<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资金计划助手</title>
  <meta name="description" content="资金计划 SaaS 智能助手 · 内嵌前端(原生 + Alpine,零构建,同源同部署)">

  <!-- 主题预置:在首次绘制前读取本机偏好并设 data-theme,避免 FOUC(非业务逻辑) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fp_theme');
        if (!t) { t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* file:// 等场景:保留 html 上的默认 light */ }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <!-- 代码高亮主题(W1 起使用) -->
  <link rel="stylesheet" href="vendor/highlight/github.min.css" id="hljs-theme">
</head>
<body x-data="app" x-cloak>
  <header class="topbar">
    <div class="brand">
      <span class="dot">&#9679;</span>
      <span>资金计划助手</span>
      <span class="badge">内嵌 · 原生+Alpine</span>
    </div>
    <button class="icon-btn" type="button" @click="toggleTheme()"
            :aria-label="theme === 'dark' ? '切换到亮色主题' : '切换到暗色主题'"
            :title="theme === 'dark' ? '切换到亮色主题' : '切换到暗色主题'"
            x-html="theme === 'dark' ? icon('sun') : icon('moon')"></button>
  </header>

  <main class="hello">
    <h1><span class="accent-chip"></span> Hello,脚手架已就位</h1>
    <p>当前主题:<strong x-text="theme"></strong> · Alpine <span x-text="alpineOk ? '已生效 ✓' : '未生效'"></span></p>
    <p><span class="badge" x-text="mockNote"></span></p>
  </main>

  <!-- 顺序要紧:app.js(module)先执行并注册 alpine:init,再加载 Alpine(defer,文档顺序在后)。 -->
  <script type="module" src="js/app.js"></script>
  <script defer src="vendor/alpine/alpine.min.js"></script>
</body>
</html>
