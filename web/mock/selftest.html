<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>selftest · web 前端自检</title>
  <!-- 载入设计令牌,以便断言 CSS 变量存在 -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    body{font-family:var(--font-sans, system-ui);margin:0;padding:1.5rem;background:var(--bg,#fff);color:var(--text,#111);}
    h1{font-size:1rem;color:var(--text-muted,#666);margin:0 0 1rem;font-weight:600;}
    #summary{font-size:1.25rem;font-weight:700;padding:.75rem 1rem;border-radius:.5rem;margin-bottom:1rem;}
    #summary.ok{background:#dcfce7;color:#166534;}
    #summary.bad{background:#fee2e2;color:#991b1b;}
    ul{list-style:none;padding:0;margin:0;}
    li{padding:.4rem .5rem;border-bottom:1px solid var(--border,#e2e8f0);font-family:var(--font-mono, monospace);font-size:.85rem;}
    li.pass::before{content:'\2713  ';color:#16a34a;font-weight:700;}
    li.fail::before{content:'\2717  ';color:#dc2626;font-weight:700;}
    li .err{color:#dc2626;}
  </style>
</head>
<body>
  <h1>web/ 前端自检(纯 JS 断言,无依赖)</h1>
  <div id="summary">running…</div>
  <ul id="results"></ul>

  <script type="module">
    import { installMockSSE, parseSSE } from './mock-sse.js';

    const results = [];
    const assert = (name, cond) => results.push({ name, ok: !!cond });
    async function assertAsync(name, fn) {
      try { results.push({ name, ok: !!(await fn()) }); }
      catch (e) { results.push({ name, ok: false, err: String(e) }); }
    }

    // 1) 设计令牌存在
    const cs = getComputedStyle(document.documentElement);
    assert('tokens: --accent 已定义', cs.getPropertyValue('--accent').trim().length > 0);
    assert('tokens: --space-1 已定义', cs.getPropertyValue('--space-1').trim().length > 0);

    // 2) parseSSE 纯函数:answer_delta×3 + done
    const canned =
      'event: answer_delta\ndata: {"text":"a"}\n\n' +
      'event: answer_delta\ndata: {"text":"b"}\n\n' +
      'event: answer_delta\ndata: {"text":"c"}\n\n' +
      'event: done\ndata: {"stop_reason":"end_turn","used_steps":0}\n\n';
    const parsed = parseSSE(canned);
    assert('parseSSE: 解析出 4 个事件', parsed.length === 4);
    assert('parseSSE: 3 个 answer_delta', parsed.filter((e) => e.event === 'answer_delta').length === 3);
    assert('parseSSE: 末事件为 done', !!parsed[3] && parsed[3].event === 'done');
    assert('parseSSE: 首事件 data.text === "a"', !!parsed[0] && parsed[0].data && parsed[0].data.text === 'a');

    // 3) mock 端到端:拦截 POST /chat 返回 text/event-stream,且为 3×answer_delta + done
    try { localStorage.setItem('fp_mock', '1'); } catch (e) { /* ignore */ }
    installMockSSE();
    await assertAsync('mock: POST /chat 被拦截且为 event-stream', async () => {
      const res = await fetch('/chat', { method: 'POST', body: '{}' });
      const ct = res.headers.get('Content-Type') || '';
      const evs = parseSSE(await res.text());
      return ct.includes('text/event-stream')
        && evs.filter((e) => e.event === 'answer_delta').length === 3
        && evs.some((e) => e.event === 'done');
    });
    await assertAsync('mock: 非 /chat 请求透传(GET 本页 200)', async () => {
      const res = await fetch('./selftest.html', { method: 'GET' });
      return res.ok;
    });

    // 渲染结果
    const passed = results.filter((r) => r.ok).length;
    const failed = results.length - passed;
    const sum = document.getElementById('summary');
    sum.textContent = `${passed} passed / ${failed} failed`;
    sum.className = failed === 0 ? 'ok' : 'bad';
    const ul = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.textContent = r.name;
      if (r.err) { const s = document.createElement('span'); s.className = 'err'; s.textContent = ' — ' + r.err; li.appendChild(s); }
      ul.appendChild(li);
    }
    window.__selftest = { passed, failed, results }; // 供脚本化检查读取
  </script>
</body>
</html>
