<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>selftest · web 前端自检</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230d9488'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../styles/tokens.css">
  <!-- 第三方库(UMD 全局),供 renderMarkdown 断言使用 -->
  <script src="../vendor/marked/marked.min.js"></script>
  <script src="../vendor/highlight/highlight.min.js"></script>
  <script src="../vendor/dompurify/purify.min.js"></script>
  <style>
    body{font-family:var(--font-sans, system-ui);margin:0;padding:1.5rem;background:var(--bg,#fff);color:var(--text,#111);}
    h1{font-size:1rem;color:var(--text-muted,#666);margin:0 0 1rem;font-weight:600;}
    #summary{font-size:1.25rem;font-weight:700;padding:.75rem 1rem;border-radius:.5rem;margin-bottom:1rem;}
    #summary.ok{background:#dcfce7;color:#166534;}
    #summary.bad{background:#fee2e2;color:#991b1b;}
    ul{list-style:none;padding:0;margin:0;}
    li{padding:.4rem .5rem;border-bottom:1px solid var(--border,#e2e8f0);font-family:var(--font-mono, monospace);font-size:.85rem;}
    li.pass::before{content:'\2713  ';color:#16a34a;font-weight:700;}
    li.fail::before{content:'\2717  ';color:#dc2626;font-weight:700;}
    li .err{color:#dc2626;}
  </style>
</head>
<body>
  <h1>web/ 前端自检(纯 JS 断言,无依赖)</h1>
  <div id="summary">running…</div>
  <ul id="results"></ul>

  <script type="module">
    import { installMockSSE, parseSSE, pickScenario } from './mock-sse.js';
    import { renderMarkdown } from '../js/markdown.js';
    import { appendToken, createChat } from '../js/chat.js';
    import { newRun, applyPlan, applyStep, applyToolCall, applyToolResult, applyErrorToRun, completeRunSteps, runSummaryLine, snapshotRun, classifyResult, toolDisplayName } from '../js/run.js';
    import { postChatStream, parseFrame, buildChatBody, buildConfirmBody, buildAskBody, setUserCtx } from '../js/sse.js';
    import { validateFile, fileExt, humanSize, isImageExt, ATTACH_LIMITS } from '../js/attachments.js';
    import { createConversationStore, groupByTime } from '../js/store.js';
    import { canManageSkills, validateSkillName, validateSkillZip, splitFrontmatter, SKILL_ZIP_LIMITS, listSkills, createSkill, setSkillStatus, uploadSkillZip, createSkills } from '../js/skills.js';

    const results = [];
    const assert = (name, cond) => results.push({ name, ok: !!cond });
    async function assertAsync(name, fn) {
      try { results.push({ name, ok: !!(await fn()) }); }
      catch (e) { results.push({ name, ok: false, err: String(e) }); }
    }

    // ===== W0:令牌 + SSE 解析 + mock =====
    const cs = getComputedStyle(document.documentElement);
    assert('tokens: --accent 已定义', cs.getPropertyValue('--accent').trim().length > 0);
    assert('tokens: --space-1 已定义', cs.getPropertyValue('--space-1').trim().length > 0);

    const canned =
      'event: answer_delta\ndata: {"text":"a"}\n\n' +
      'event: answer_delta\ndata: {"text":"b"}\n\n' +
      'event: answer_delta\ndata: {"text":"c"}\n\n' +
      'event: done\ndata: {"stop_reason":"end_turn","used_steps":0}\n\n';
    const parsed = parseSSE(canned);
    assert('parseSSE: 解析出 4 个事件', parsed.length === 4);
    assert('parseSSE: 3 个 answer_delta', parsed.filter((e) => e.event === 'answer_delta').length === 3);
    assert('parseSSE: 末事件为 done', !!parsed[3] && parsed[3].event === 'done');
    assert('parseSSE: 首事件 data.text === "a"', !!parsed[0] && parsed[0].data && parsed[0].data.text === 'a');

    try { localStorage.setItem('fp_mock', '1'); } catch (e) { /* ignore */ }
    installMockSSE();
    await assertAsync('mock: POST /chat 被拦截且为 event-stream', async () => {
      const res = await fetch('/chat', { method: 'POST', body: '{}' });
      const ct = res.headers.get('Content-Type') || '';
      const evs = parseSSE(await res.text());
      return ct.includes('text/event-stream')
        && evs.filter((e) => e.event === 'answer_delta').length === 3
        && evs.some((e) => e.event === 'done');
    });
    await assertAsync('mock: 非 /chat 请求透传(GET 本页 200)', async () => {
      const res = await fetch('./selftest.html', { method: 'GET' });
      return res.ok;
    });

    // ===== W1:Markdown 消毒 / 渲染 / 流式 append =====
    // 注意:脚本闭合标签在内联 script 里必须转义为 <\/script>,否则 HTML 解析器会提前闭合本块。
    assert('md: script 标签被清除', !renderMarkdown('<script>alert(1)<\/script>').includes('<script'));
    assert('md: onerror 事件属性被清除', !/onerror/i.test(renderMarkdown('<img src=x onerror=alert(1)>')));
    assert('md: javascript: URL 被清除', !/javascript:/i.test(renderMarkdown('[x](javascript:alert(1))')));
    assert('md: **bold** → <strong>', renderMarkdown('**hi**').includes('<strong>hi</strong>'));

    const cb = renderMarkdown('```python\nprint(1)\n```');
    assert('md: 代码块含 code-block + copy-btn', cb.includes('code-block') && cb.includes('copy-btn'));
    assert('md: 代码块经 hljs 高亮', cb.includes('hljs'));
    assert('md: 代码块标注语言 python', cb.includes('python'));

    const sm = { raw: '', streamText: '' };
    appendToken(sm, 'a'); appendToken(sm, 'b1'); appendToken(sm, 'c');
    assert('stream: append 顺序正确(ab1c)', sm.streamText === 'ab1c' && sm.raw === 'ab1c');

    // ===== W2:SSE 分流 / currentRun 投影 / 折叠分档 / 集成 =====
    const multi =
      'event: plan\ndata: {"version":1,"steps":[]}\n\n' +
      'event: step\ndata: {"index":0,"note":"n"}\n\n' +
      'event: tool_call\ndata: {"id":"c1","tool":"query_finance_data","arguments":{}}\n\n' +
      'event: tool_result_summary\ndata: {"id":"c1","tool":"query_finance_data","summary":"s","workspace_ref":"w"}\n\n' +
      'event: answer_delta\ndata: {"text":"a"}\n\n' +
      'event: done\ndata: {"stop_reason":"end_turn","used_steps":1}\n\n';
    const mtypes = parseSSE(multi).map((e) => e.event);
    assert('sse: 分流各事件类型', ['plan', 'step', 'tool_call', 'tool_result_summary', 'answer_delta', 'done'].every((t) => mtypes.includes(t)));

    const run = newRun();
    applyPlan(run, { version: 1, steps: [{ id: 'a', goal: 'g0' }, { id: 'b', goal: 'g1' }, { id: 'c', goal: 'g2' }] });
    assert('run: applyPlan 设置 3 步(pending)', run.plan.steps.length === 3 && run.plan.steps[0].status === 'pending');
    applyStep(run, { index: 1, note: 'doing' });
    assert('run: applyStep 投影(0完成/1进行中/focus)', run.plan.steps[0].status === 'done' && run.plan.steps[1].status === 'running' && run.focus === 'doing');
    applyToolCall(run, { id: 't1', tool: 'search_knowledge', arguments: {} });
    const it1 = run.toolTimeline.find((t) => t.id === 't1');
    assert('run: tool_call→running + 文案映射', it1.status === 'running' && it1.displayName === '检索知识库');
    applyToolResult(run, { id: 't1', tool: 'search_knowledge', summary: '短结果', workspace_ref: 'w' });
    assert('run: tool_result→done + tier=inline', it1.status === 'done' && it1.tier === 'inline');
    applyToolCall(run, { id: 't2', tool: 'x', arguments: {} });
    applyErrorToRun(run);
    assert('run: applyErrorToRun 运行中→失败', run.toolTimeline.find((t) => t.id === 't2').status === 'failed');

    assert('run: toolDisplayName 回退原名', toolDisplayName('unknown_tool') === 'unknown_tool');
    assert('fold: 短→inline', classifyResult('返回 3 行').tier === 'inline');
    assert('fold: 长文本→long', classifyResult('x'.repeat(250)).tier === 'long');
    assert('fold: 表格→structured', classifyResult('| a | b |\n| - | - |\n| 1 | 2 |').tier === 'structured');
    assert('fold: 代码围栏→structured', classifyResult('```js\ncode\n```').tier === 'structured');

    assert('run: snapshotRun 有 plan→run 块', !!snapshotRun(run) && snapshotRun(run).type === 'run');
    assert('run: snapshotRun 无 plan→null', snapshotRun(newRun()) === null);

    const cbody = buildConfirmBody('sid', true);
    assert('sse: buildConfirmBody 形状', cbody.session_id === 'sid' && cbody.confirmation.confirmed === true);
    const abody = buildAskBody('sid', { 0: 'x' });
    assert('sse: buildAskBody 形状', abody.session_id === 'sid' && abody.answers['0'] === 'x');

    await assertAsync('sse(集成): simple 流 answer_delta×3 + done', async () => {
      const evs = []; const r = await postChatStream(buildChatBody('hi'), { onEvent: (t) => evs.push(t) });
      return r.sawDone === true && evs.filter((t) => t === 'answer_delta').length === 3 && evs.includes('done');
    });
    let resumeSid = '';
    await assertAsync('sse(集成): 复杂流 plan+confirm 暂停(无 done,有 sessionId)', async () => {
      const evs = []; const r = await postChatStream(buildChatBody('复杂任务确认'), { onEvent: (t) => evs.push(t) });
      resumeSid = r.sessionId;
      return r.sawDone === false && !!r.sessionId && evs.includes('plan') && evs.includes('confirm_request');
    });
    await assertAsync('sse(集成): /chat/confirm 续传至 citation+done', async () => {
      const evs = []; const r = await postChatStream(buildConfirmBody(resumeSid, true), { url: '/chat/confirm', onEvent: (t) => evs.push(t) });
      return r.sawDone === true && evs.includes('citation') && evs.includes('done');
    });

    // ===== W3:文件校验 + Repository + 附件 =====
    const mkFile = (name, type, size) => ({ name, type, size }); // 鸭子类型(validateFile 仅读 name/type/size)
    assert('upload: txt 通过', validateFile(mkFile('a.txt', 'text/plain', 100)).ok === true);
    assert('upload: 越白名单(exe)拒', validateFile(mkFile('a.exe', 'application/octet-stream', 100)).ok === false);
    assert('upload: MIME 与扩展名不符拒', validateFile(mkFile('a.png', 'text/plain', 100)).ok === false);
    assert('upload: 超大小上限拒', validateFile(mkFile('a.txt', 'text/plain', ATTACH_LIMITS.maxBytes + 1)).ok === false);
    assert('upload: 空 MIME 回退扩展名通过', validateFile(mkFile('a.docx', '', 100)).ok === true);
    assert('upload: 去重拒', validateFile(mkFile('a.txt', 'text/plain', 100), [{ name: 'a.txt', size: 100 }]).ok === false);
    assert('upload: fileExt/humanSize', fileExt('x.PDF') === 'pdf' && humanSize(2048) === '2.0KB' && humanSize(500) === '500B');

    const store = createConversationStore();
    const conv = store.createConversation('selftest临时');
    assert('repo: create + list 含新会话', store.listConversations().some((x) => x.id === conv.id));
    store.saveMessages(conv.id, [
      { id: 'u1', role: 'user', raw: 'hi', attachments: [{ file_id: 'f1', name: 'a.png', size: 10, mime: 'image/png', ext: 'png', status: 'uploaded', parse_supported: false, thumbUrl: 'blob:strip-me', _file: {} }] },
      { id: 'a1', role: 'assistant', streaming: true, blocks: [{ type: 'text', raw: '答', html: '<p>答</p>', open: false }, { type: 'run', plan: { version: 1, steps: [{ id: 's', goal: 'g', status: 'done' }] }, toolTimeline: [], collapsed: true }] },
    ]);
    const got = store.getConversation(conv.id);
    assert('repo: 富 blocks 往返(text+run)', got.messages.length === 2 && got.messages[1].blocks[1].type === 'run');
    assert('repo: 附件脱敏(去 thumbUrl/_file,留 file_id)', got.messages[0].attachments[0].thumbUrl === undefined && got.messages[0].attachments[0]._file === undefined && got.messages[0].attachments[0].file_id === 'f1');
    assert('repo: 助手 streaming 落库为 false', got.messages[1].streaming === false);
    store.rename(conv.id, '改名了');
    assert('repo: rename', store.getConversation(conv.id).title === '改名了');
    store.remove(conv.id);
    assert('repo: remove → null(清理)', store.getConversation(conv.id) === null);

    const now = Date.now();
    const grp = groupByTime([{ id: 'a', updated_at: now }, { id: 'b', updated_at: now - 3 * 86400000 }, { id: 'c', updated_at: now - 30 * 86400000 }], now);
    assert('repo: groupByTime 今天/7天内/更早', grp.today.length === 1 && grp.week.length === 1 && grp.older.length === 1);

    assert('chat: payload 携带 attachments', (() => { const b = buildChatBody('hi', ['f1', 'f2']); return Array.isArray(b.attachments) && b.attachments.length === 2 && b.message === 'hi'; })());
    assert('chat: 无附件不带 attachments 字段', buildChatBody('hi').attachments === undefined);

    // ===== W4:Skill 管理(角色门控 + 校验 + API)=====
    assert('skill: canManageSkills 角色门控', canManageSkills(['analyst']) === false && canManageSkills(['skill_admin']) === true);
    assert('skill: name 校验(空/非法/合法)', validateSkillName('').ok === false && validateSkillName('a b').ok === false && validateSkillName('fund_helper-1').ok === true);
    assert('skill: zip 类型校验', validateSkillZip({ name: 'a.txt', size: 10 }).ok === false && validateSkillZip({ name: 'a.zip', size: 10 }).ok === true);
    assert('skill: zip 超大小拒', validateSkillZip({ name: 'a.zip', size: SKILL_ZIP_LIMITS.maxBytes + 1 }).ok === false);
    assert('skill: SKILL.md 预览消毒(script 清除)', !renderMarkdown(splitFrontmatter('---\nname: x\n---\n<img src=q onerror=alert(1)><script>x<\/script>').body).includes('<script'));
    const sfm = splitFrontmatter('---\nname: demo\ndescription: d\n---\n# body\ntext');
    assert('skill: splitFrontmatter(meta+body)', sfm.meta.name === 'demo' && sfm.meta.description === 'd' && /# body/.test(sfm.body));

    await assertAsync('skill api: list 返回数组', async () => Array.isArray(await listSkills()));
    await assertAsync('skill api: create 合法→draft', async () => { const c = await createSkill('selftest_skill', '---\nname: selftest_skill\ndescription: d\n---\n# x'); return c.status === 'draft' && c.name === 'selftest_skill'; });
    await assertAsync('skill api: create 非法→422+errors', async () => { try { await createSkill('bad', '没有 frontmatter'); return false; } catch (e) { return e.status === 422 && Array.isArray(e.data.errors) && e.data.errors.length > 0; } });
    await assertAsync('skill api: status→active', async () => { const l = await listSkills(); const d = l.find((s) => s.status === 'draft'); if (!d) return false; const r = await setSkillStatus(d.id, 'active'); return r.status === 'active'; });
    await assertAsync('skill api: upload 多条结果(成功+拒绝)', async () => { const r = await uploadSkillZip(new File(['x'], 'pack.zip', { type: 'application/zip' })); return Array.isArray(r.results) && r.results.length >= 2 && r.results.some((x) => x.ok) && r.results.some((x) => !x.ok); });
    await assertAsync('skill api: upload 非法 zip→400', async () => { try { await uploadSkillZip(new File(['x'], 'invalid.zip', { type: 'application/zip' })); return false; } catch (e) { return e.status === 400; } });

    // ===== 审计补强:P0 安全 / P1 事件投影 / P2 边界 =====
    // ---- P0 安全:更多 XSS 向量 + 工具结果消毒 + 安全渲染哨兵 ----
    assert('xss: iframe 清除', !/<iframe/i.test(renderMarkdown('<iframe src="javascript:alert(1)"></iframe>')));
    assert('xss: svg onload 清除', !/onload/i.test(renderMarkdown('<svg onload=alert(1)></svg>')));
    assert('xss: object/embed 清除', (() => { const h = renderMarkdown('<object data=x></object><embed src=x>'); return !/<object/i.test(h) && !/<embed/i.test(h); })());
    assert('xss: form/input 清除', (() => { const h = renderMarkdown('<form><input value=x></form>'); return !/<form/i.test(h) && !/<input/i.test(h); })());
    assert('xss: 大小写 JaVaScRiPt: 清除', !/javascript:/i.test(renderMarkdown('[x](JaVaScRiPt:alert(1))')));
    assert('xss: onmouseover 清除', !/onmouseover/i.test(renderMarkdown('<a href="#" onmouseover=alert(1)>x</a>')));
    assert('xss: details ontoggle 清除', !/ontoggle/i.test(renderMarkdown('<details open ontoggle=alert(1)></details>')));
    assert('xss: <style> 清除', !/<style/i.test(renderMarkdown('<style>*{x:1}</style>')));
    assert('xss: 外链注入 rel=noopener + target', (() => { const h = renderMarkdown('[x](https://evil.example/)'); return /rel="noopener noreferrer"/.test(h) && /target="_blank"/.test(h); })());

    const _chatSan = createChat();
    assert('xss: 工具结果经 renderMarkdown 消毒(onerror)', !/onerror/i.test(_chatSan.toolResultHtml({ resultSummary: '<img src=x onerror=alert(1)>' })));
    assert('xss: 工具结果 script 清除', !/<script/i.test(_chatSan.toolResultHtml({ resultSummary: 'a<script>x<\/script>b' })));
    assert('xss: SKILL 预览 iframe/onerror 清除', (() => { const h = renderMarkdown(splitFrontmatter('---\nname: x\n---\n<iframe></iframe><img src=q onerror=alert(1)>').body); return !/<iframe/i.test(h) && !/onerror/i.test(h); })());

    await assertAsync('safe-render: 不可信文本不走 x-html(prompt/message/question)', async () => {
      const html = await (await fetch('../index.html')).text();
      return !/x-html\s*=\s*"b\.prompt"/.test(html) && !/x-html\s*=\s*"b\.message"/.test(html) && !/x-html\s*=\s*"q\.question"/.test(html);
    });

    // ---- P1 事件投影:createChat() POJO 驱动 _onEvent / _finishDone(最小 this 桩)----
    const mkChat = () => {
      const c = createChat();
      c.scrollToBottom = () => {};
      c.$nextTick = (fn) => { if (fn) fn(); };
      c.stuckToBottom = false;
      c.activeConvId = null; // _persist 早返回,不写 localStorage
      c.messages = [{ id: 'a', role: 'assistant', blocks: [], streaming: true, created_at: 0 }];
      c.currentRun = newRun();
      return c;
    };

    const cP = mkChat();
    cP._onEvent('plan', { version: 1, steps: [{ id: 's1', goal: 'g' }] });
    assert('proj: plan→currentRun.plan', !!cP.currentRun.plan && cP.currentRun.plan.steps.length === 1);
    cP._onEvent('step', { index: 0, note: '进行' });
    assert('proj: step→focus', cP.currentRun.focus === '进行');
    cP._onEvent('tool_call', { id: 't1', tool: 'query_finance_data', arguments: {} });
    cP._onEvent('tool_result_summary', { id: 't1', tool: 'query_finance_data', summary: '短', workspace_ref: 'w' });
    assert('proj: tool_call/result→时间线 done', cP.currentRun.toolTimeline.length === 1 && cP.currentRun.toolTimeline[0].status === 'done');
    cP._onEvent('answer_delta', { text: '你好' });
    assert('proj: answer_delta→开放 text 块', cP.messages[0].blocks.some((b) => b.type === 'text' && b.raw === '你好' && b.open));
    cP._onEvent('citation', { items: [{ title: 'T', source: 'S', ref: 'https://x/' }] });
    assert('proj: citation→映射 block', cP.messages[0].blocks.some((b) => b.type === 'citation' && b.items[0].title === 'T'));

    const cCf = mkChat();
    cCf._onEvent('confirm_request', { id: 'cf', prompt: 'p', options: ['是', '否'] });
    assert('proj: confirm→pendingResume + confirm 块', !!cCf.pendingResume && cCf.pendingResume.kind === 'confirm' && cCf.messages[0].blocks.some((b) => b.type === 'confirm'));

    const cAsk = mkChat();
    cAsk._onEvent('ask_user', { id: 'a', questions: [{ question: 'q?', options: ['x'] }] });
    assert('proj: ask→pendingResume + ask 块', !!cAsk.pendingResume && cAsk.pendingResume.kind === 'ask' && cAsk.messages[0].blocks.some((b) => b.type === 'ask'));

    const cErr = mkChat();
    cErr._onEvent('tool_call', { id: 'x', tool: 'x', arguments: {} });
    cErr._onEvent('error', { code: 'E', message: 'boom' });
    assert('proj: error→error 块 + 运行中工具转失败', cErr._turnErrored === true && cErr.messages[0].blocks.some((b) => b.type === 'error') && cErr.currentRun.toolTimeline[0].status === 'failed');

    const cUnk = mkChat();
    const _nblk = cUnk.messages[0].blocks.length;
    cUnk._onEvent('totally_unknown', { foo: 1 });
    assert('proj: 未知事件忽略不崩', cUnk.messages[0].blocks.length === _nblk);

    const cDone = mkChat();
    cDone._onEvent('plan', { version: 1, steps: [{ id: 's', goal: 'g' }] });
    cDone._onEvent('answer_delta', { text: 'ans' });
    cDone._finishDone();
    assert('proj: done→run 快照入消息 + currentRun 清空', cDone.currentRun === null && cDone.messages[0].blocks.some((b) => b.type === 'run') && cDone.messages[0].streaming === false);
    assert('proj: done→open text 关闭并渲染', cDone.messages[0].blocks.some((b) => b.type === 'text' && b.open === false && /ans/.test(b.html || '')));

    const cStop = mkChat();
    cStop._onEvent('plan', { version: 1, steps: [{ id: 's', goal: 'g' }] });
    cStop._finishStopped();
    assert('proj: stopped→「已停止」note + currentRun 清空', cStop.currentRun === null && cStop.messages[0].blocks.some((b) => b.type === 'note' && /已停止/.test(b.text)));

    // ---- P1 SSE 韧性:parseFrame(生产解析器)+ parseSSE 畸形/截断不崩 ----
    assert('sse: parseFrame 正常帧', (() => { const f = parseFrame('event: done\ndata: {"stop_reason":"x"}'); return f.event === 'done' && f.data.stop_reason === 'x'; })());
    assert('sse: parseFrame 空帧→null', parseFrame('') === null && parseFrame('   ') === null);
    assert('sse: parseFrame 非 JSON data 保留原文', parseFrame('event: answer_delta\ndata: not json').data === 'not json');
    assert('sse: parseFrame 缺 event→message', (() => { const f = parseFrame('data: {"a":1}'); return f.event === 'message' && f.data.a === 1; })());
    assert('sse: parseFrame 多行 data 拼接', parseFrame('event: x\ndata: l1\ndata: l2').data === 'l1\nl2');
    assert('sse: parseSSE 截断流不崩', (() => { const e = parseSSE('event: answer_delta\ndata: {"text":"a"}\n\nevent: done\ndata: {"sto'); return Array.isArray(e) && e[0].data.text === 'a'; })());
    assert('sse: parseSSE 空/纯空行→[]', parseSSE('').length === 0 && parseSSE('\n\n\n\n').length === 0);
    assert('sse: parseSSE 非 JSON 数据保留原文不崩', (() => { const e = parseSSE('event: error\ndata: oops\n\n'); return e[0].event === 'error' && e[0].data === 'oops'; })());

    // ---- P2 边界:折叠阈值 / replan / clearAll / 角色门控 / 校验边界 ----
    assert('fold: 恰 3 行→inline', classifyResult('a\nb\nc').tier === 'inline');
    assert('fold: 4 行→long', classifyResult('a\nb\nc\nd').tier === 'long');
    assert('fold: JSON 形状→structured', classifyResult('{\n "a": 1\n}').tier === 'structured');
    assert('fold: 长列表>4 项→structured', classifyResult('- a\n- b\n- c\n- d\n- e').tier === 'structured');

    const rr = newRun();
    applyPlan(rr, { version: 1, steps: [{ id: 'a', goal: 'g0' }, { id: 'b', goal: 'g1' }] });
    applyPlan(rr, { version: 2, steps: [{ id: 'x', goal: 'n0' }, { id: 'y', goal: 'n1' }, { id: 'z', goal: 'n2' }] });
    assert('run: replan(v2)替换 steps', rr.plan.version === 2 && rr.plan.steps.length === 3 && rr.plan.steps[0].id === 'x');
    applyStep(rr, { index: 1, note: 'd' });
    completeRunSteps(rr);
    assert('run: completeRunSteps running→done', rr.plan.steps[1].status === 'done');
    assert('run: runSummaryLine 文案', /计划 3 步/.test(runSummaryLine(rr)));

    const st2 = createConversationStore();
    const cv2 = st2.createConversation('待清除');
    st2.saveMessages(cv2.id, [{ id: 'u', role: 'user', raw: 'x', attachments: [] }]);
    st2.clearAll();
    assert('repo: clearAll 清空索引与消息', st2.listConversations().length === 0 && st2.getConversation(cv2.id) === null);

    const sk2 = createSkills();
    setUserCtx({ tenant_id: 't', user_id: 'u', roles: ['analyst'], data_scope: {}, permissions: ['*'] });
    assert('skill: skillAdmin 非授权→false', sk2.skillAdmin() === false);
    setUserCtx({ tenant_id: 't', user_id: 'u', roles: ['skill_admin'], data_scope: {}, permissions: ['*'] });
    assert('skill: skillAdmin 授权→true', sk2.skillAdmin() === true);
    setUserCtx(null);
    assert('skill: name 长度边界(<2/>64 拒)', validateSkillName('a').ok === false && validateSkillName('a'.repeat(65)).ok === false && validateSkillName('ab').ok === true);

    assert('upload: isImageExt', isImageExt('png') && isImageExt('JPG') && !isImageExt('pdf'));
    assert('mock: pickScenario 关键词路由', pickScenario('并行取数') === 'parallel' && pickScenario('请确认复核') === 'complex' && pickScenario('随便问问') === 'simple');

    // ---- 逐条消息复制(copyTextOf 纯文本提取)----
    const _cCopy = createChat();
    assert('copy: 用户消息取 raw', _cCopy.copyTextOf({ role: 'user', raw: '提问X', blocks: [] }) === '提问X');
    assert('copy: 助手仅拼接 text 块(跳过引用/卡片)', _cCopy.copyTextOf({ role: 'assistant', blocks: [{ type: 'text', raw: 'A' }, { type: 'citation', items: [] }, { type: 'text', raw: 'B' }] }) === 'A\nB');
    assert('copy: 用户空 raw→空串', _cCopy.copyTextOf({ role: 'user', blocks: [] }) === '');
    assert('copy: 助手无 text 块→空串', _cCopy.copyTextOf({ role: 'assistant', blocks: [{ type: 'run' }] }) === '');

    // ---- FB-1:citation ref 协议白名单(safeHref + _normCitations 净化,红线 7)----
    const _cCite = createChat();
    assert('xss: citation ref javascript: → #', _cCite.safeHref('javascript:alert(1)') === '#');
    assert('xss: citation ref 大小写+制表符绕过 → #', _cCite.safeHref('Ja\tvaScRiPt:alert(1)') === '#' && _cCite.safeHref('  JAVASCRIPT:alert(1)') === '#');
    assert('xss: citation ref data:/vbscript: → #', _cCite.safeHref('data:text/html,<x>') === '#' && _cCite.safeHref('vbscript:msgbox(1)') === '#');
    assert('safe: citation ref http(s)/相对/锚点/空 放行', _cCite.safeHref('https://x/') === 'https://x/' && _cCite.safeHref('/p') === '/p' && _cCite.safeHref('#a') === '#a' && _cCite.safeHref('') === '#');
    assert('proj: _normCitations 经 safeHref 净化 ref', _cCite._normCitations({ items: [{ title: 'T', ref: 'javascript:alert(1)' }] })[0].ref === '#' && _cCite._normCitations({ items: [{ title: 'T', source: 'S', ref: 'https://ok/' }] })[0].ref === 'https://ok/');

    // ===== 渲染结果 =====
    const passed = results.filter((r) => r.ok).length;
    const failed = results.length - passed;
    const sum = document.getElementById('summary');
    sum.textContent = `${passed} passed / ${failed} failed`;
    sum.className = failed === 0 ? 'ok' : 'bad';
    const ul = document.getElementById('results');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.textContent = r.name;
      if (r.err) { const s = document.createElement('span'); s.className = 'err'; s.textContent = ' — ' + r.err; li.appendChild(s); }
      ul.appendChild(li);
    }
    window.__selftest = { passed, failed, results };
  </script>
</body>
</html>
