[project]
name = "zijin-plan-agent"
version = "0.1.0"
description = "资金计划 SaaS 智能助手 Agent —— monorepo 工作区根(虚拟包,不安装自身)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
    "types-openpyxl>=3.1",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 仓库注释/文档大量使用中文全角标点,关闭"易混淆 Unicode 字符"系列误报
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "contracts",
    "llm",
    "agent_gateway",
    "orchestrator",
    "rag_svc",
    "data_svc",
    "code_svc",
    "sop_executor",
    "memory_svc",
    "reflection_worker",
    "sandbox_svc",
    "scheduler_svc",
]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
warn_unreachable = true
# conftest.py 多服务同名(mypy 模块冲突);tests/fixtures/ 下是被解析的样本数据(如 sample_repo
# 的故意无注解代码),二者都不纳入严格类型门禁(测试用例本身仍全量类型检查)。
exclude = ['(^|/)conftest\.py$', '/fixtures/']

# lightrag(rag_svc 的 LightRagStore 生产适配器,默认不安装)—— 缺失/未类型化导入豁免。
[[tool.mypy.overrides]]
module = ["lightrag", "lightrag.*"]
ignore_missing_imports = true

# psycopg(data_svc 的 PostgresExecutor 生产依赖,默认不安装,懒导入)—— 缺失导入豁免。
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

# tree-sitter 语言 grammar 包(C 扩展,未随包提供类型)—— 视为 Any。
[[tool.mypy.overrides]]
module = [
    "tree_sitter_python",
    "tree_sitter_javascript",
    "tree_sitter_typescript",
    "tree_sitter_java",
    "tree_sitter_sql",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
