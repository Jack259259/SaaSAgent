[project]
name = "data-svc"
version = "0.1.0"
description = "WrenAI 代理 + SQL 校验层 + RLS 注入 + 只读执行(CLAUDE.md §3 / 方案 §5.2)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "pydantic>=2.7",
    "sqlglot>=25",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
