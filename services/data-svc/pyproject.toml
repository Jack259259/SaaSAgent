[project]
name = "data-svc"
version = "0.1.0"
description = "WrenAI 代理 + SQL 校验层 + RLS 注入 + 只读执行(CLAUDE.md §3 / 方案 §5.2)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "pydantic>=2.7",
    "sqlglot>=25",
    "duckdb>=1.0",
    "httpx>=0.27",
    "pyyaml>=6",
]

# 嵌入式 WrenAI(NL2SQL 语义层/dry_run 校验/dry_plan 方言转换,不执行查询)。
# 默认不安装(照 rag-svc lightrag 先例):uv sync --all-packages --extra wren。
# 红线 1 门禁:该依赖树禁止出现 langchain/langgraph/crewai(见 docs/integration/wrenai.md)。
[project.optional-dependencies]
wren = ["wrenai>=0.13,<0.14"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
