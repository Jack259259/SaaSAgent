[project]
name = "memory-svc"
version = "0.1.0"
description = "分层记忆:画像/情景/经验存取 + 脱敏 + 重要性门槛 + 租户隔离(方案 §7)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "llm",
    "pydantic>=2.7",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
llm = { workspace = true }
