[project]
name = "orchestrator"
version = "0.1.0"
description = "自研薄编排循环、Skill 加载、记忆注入、预算控制(CLAUDE.md §3 / 方案 §11.1)"
requires-python = ">=3.12"
dependencies = [
    "code-svc",
    "common",
    "contracts",
    "data-svc",
    "llm",
    "memory-svc",
    "rag-svc",
    "sandbox-svc",
    "sop-executor",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
code-svc = { workspace = true }
common = { workspace = true }
contracts = { workspace = true }
data-svc = { workspace = true }
llm = { workspace = true }
memory-svc = { workspace = true }
rag-svc = { workspace = true }
sandbox-svc = { workspace = true }
sop-executor = { workspace = true }
