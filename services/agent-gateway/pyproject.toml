[project]
name = "agent-gateway"
version = "0.1.0"
description = "会话管理、SSE 流式、身份签发与透传(CLAUDE.md §3 / 方案 §11.1)"
requires-python = ">=3.12"
dependencies = [
    "code-svc",
    "common",
    "contracts",
    "data-svc",
    "llm",
    "orchestrator",
    "rag-svc",
    "sop-executor",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "structlog>=24.1",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
code-svc = { workspace = true }
common = { workspace = true }
contracts = { workspace = true }
data-svc = { workspace = true }
llm = { workspace = true }
orchestrator = { workspace = true }
rag-svc = { workspace = true }
sop-executor = { workspace = true }
