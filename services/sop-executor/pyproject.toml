[project]
name = "sop-executor"
version = "0.1.0"
description = "SOP 确定性状态机 + 确认恢复 + postconditions 回查 + 回放(方案 §5.4)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.21",
    "playwright>=1.40",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
