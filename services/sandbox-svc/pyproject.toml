[project]
name = "sandbox-svc"
version = "0.1.0"
description = "run_analysis 受限沙箱:无网络、无库连接、资源限额(CLAUDE.md §3 红线 11 / 方案 §5.5)"
requires-python = ">=3.12"
# pandas/numpy/matplotlib 是**沙箱子进程**的依赖白名单(经 _harness 动态导入);
# runner 与 handler 的受检代码不静态导入它们。
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
