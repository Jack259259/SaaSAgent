[project]
name = "rag-svc"
version = "0.1.0"
description = "LightRAG 双库封装 + ACL 过滤 + 引用组装(CLAUDE.md §3 / 方案 §11.1)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi>=0.115",
