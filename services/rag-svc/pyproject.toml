[project]
name = "rag-svc"
version = "0.1.0"
description = "知识库 RAG:双库 + 检索前 ACL 过滤 + 引用组装(CLAUDE.md §3 / 方案 §5.3)"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "llm",
    "pydantic>=2.7",
]

# 可选生产后端:真实 LightRAG 知识图谱(默认/CI 不安装;开启方式见 docs/deploy.md)。
# 惰性导入(rag_svc.lightrag_store._ensure / graph.LightRagGraphProvider);mypy 已 ignore_missing_imports。
[project.optional-dependencies]
lightrag = ["lightrag-hku==1.5.4"]

[project.scripts]
ingest = "rag_svc.ingest:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { workspace = true }
llm = { workspace = true }
