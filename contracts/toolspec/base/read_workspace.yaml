name: read_workspace
description: 按句柄分页读取工作区大对象(单次返回限额,§4.3)。
input_schema:
  type: object
  additionalProperties: false
  required: [ref]
  properties:
    ref: { type: string }
    page: { type: integer, minimum: 1 }
    page_size: { type: integer, minimum: 1, maximum: 1000 }
output_schema:
  type: object
  additionalProperties: false
  properties:
    chunk: { type: string }
    page: { type: integer }
    total_pages: { type: integer }
    eof: { type: boolean }
permission_scope: base.workspace.read
side_effects: read
confirmation_required: false
timeout_ms: 10000
errors: [NOT_FOUND, VALIDATION_FAILED]
version: 0.1.0
